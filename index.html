<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매안초등학교 IB 디지털 도구 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC;
    --paper:#FFFDF7;
    --ink:#4A3426;
    --ink-soft:#8A6E5C;
    --line:#F0DFC8;
    --shadow:0 6px 0 rgba(150,100,60,.10), 0 10px 24px rgba(150,100,60,.10);
    --g1:#F28C7A; --g1s:#FDE5DF;
    --g2:#F5A54A; --g2s:#FDEBD3;
    --g3:#E8B931; --g3s:#FBF1CC;
    --g4:#7DB86A; --g4s:#E5F2DD;
    --g5:#5DA9D6; --g5s:#DDEEF8;
    --g6:#A98BD4; --g6s:#EEE6F8;
    --g7:#B8896A; --g7s:#F2E6DC;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;word-break:keep-all;overflow-wrap:break-word;line-break:strict;background:var(--cream);color:var(--ink);
    font-family:"Gowun Dodum",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(200,150,100,.08) 1.2px, transparent 1.4px);
    background-size:18px 18px;
  }
  h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}

  /* ---------- Hero scene ---------- */
  .hero{position:relative;overflow:hidden;height:470px;
    background:linear-gradient(180deg,#FFD9A8 0%,#FFE9C9 45%,#FFF3DE 100%)}
  .hero svg.scene{position:absolute;inset:auto 0 0 0;width:100%;height:100%}
  .hero-text{position:absolute;left:0;right:0;top:26px;text-align:center;z-index:3;padding:0 16px}
  .hero-text .badge{display:inline-block;background:#fff;border:2px solid #F3C98F;color:#C46A2C;
    border-radius:999px;padding:4px 14px;font-size:13px;font-family:"Jua";letter-spacing:.5px;
    box-shadow:0 3px 0 #F3C98F}
  .school{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px}
  .school-name{font-family:"Jua",sans-serif;font-size:clamp(42px,11vw,64px);line-height:1.05;letter-spacing:2px;
    color:#D2603A;-webkit-text-stroke:7px #fff;paint-order:stroke fill;
    text-shadow:0 5px 0 rgba(210,96,58,.22),0 10px 18px rgba(200,110,60,.18);
    animation:hello 3.6s ease-in-out infinite;display:inline-block}
  .spark{font-size:clamp(18px,4.5vw,26px);color:#F5B841;animation:twk 2.4s ease-in-out infinite;display:inline-block}
  .spark.s-r{animation-delay:-1.2s;color:#F28C7A}
  @keyframes hello{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes twk{0%,100%{transform:scale(.8) rotate(0);opacity:.6}50%{transform:scale(1.2) rotate(20deg);opacity:1}}
  .hero-text h1{margin:4px 0 4px;font-size:clamp(24px,6vw,34px);color:#6B3F22;
    text-shadow:0 3px 0 #fff, 0 5px 0 rgba(200,120,60,.18)}
  .hero-text p{margin:0;color:#8A5A3A;font-size:15px;text-wrap:balance}
  .hero-text h1{text-wrap:balance}
  @media(max-width:420px){
    .card{padding:14px 12px;gap:12px}
    .card .ic{width:46px;height:46px;border-radius:14px}
    .card .ic svg{width:25px;height:25px}
    .card h3{font-size:17px}
    .card p{font-size:14px;line-height:1.55}
    .card .go{width:26px;height:26px}
  }

  .sun{transform-origin:center;transform-box:fill-box;animation:spin 40s linear infinite}
  .sun-glow{animation:pulse 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  .cloud{animation:drift linear infinite}
  .c1{animation-duration:48s}.c2{animation-duration:64s;animation-delay:-20s}.c3{animation-duration:56s;animation-delay:-38s}
  .flag{transform-origin:left center;transform-box:fill-box;animation:wave 1.6s ease-in-out infinite}
  .tree{transform-origin:bottom center;transform-box:fill-box;animation:sway 5s ease-in-out infinite}
  .tree.t2{animation-delay:-1.5s}.tree.t3{animation-delay:-3s}
  .bird{animation:fly 18s linear infinite}
  .bird path{animation:flap .6s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
  .float{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float.f2{animation-delay:-1.3s}.float.f3{animation-delay:-2.6s}
  .window{animation:twinkle 6s ease-in-out infinite}
  .window.w2{animation-delay:-2s}.window.w3{animation-delay:-4s}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.3}}
  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1500px)}}
  @keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-8deg) scaleX(.92)}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes fly{from{transform:translate(-80px,0)}50%{transform:translate(700px,-20px)}to{transform:translate(1500px,10px)}}
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.4)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
  @keyframes twinkle{0%,100%{fill:#FFE7A3}50%{fill:#FFF6D6}}

  /* ---------- Toolbar ---------- */
  .bar{position:sticky;top:0;z-index:20;background:rgba(255,248,236,.92);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:2px dashed var(--line);padding:12px 0 10px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  .search{position:relative;margin-bottom:10px}
  .search input{width:100%;font:inherit;font-size:16px;color:var(--ink);
    padding:12px 14px 12px 44px;border-radius:16px;border:2px solid var(--line);background:#fff;
    outline:none;transition:border-color .2s, box-shadow .2s}
  .search input:focus{border-color:#F3B87A;box-shadow:0 0 0 4px rgba(243,184,122,.25)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#C98B5E}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font-family:"Jua";font-size:15px;border:2px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform .15s, background .2s, color .2s;
    box-shadow:0 3px 0 var(--line)}
  .chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
  .chip.on{background:var(--c,#F5A54A);border-color:var(--c,#F5A54A);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}

  /* ---------- Sections ---------- */
  main{padding:18px 0 40px}
  .list-head{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
  .list-head .jua{font-size:22px}
  .list-head .count{font-size:13px;color:var(--ink-soft)}
  .list-head .rule{flex:1;border-top:2px dashed var(--line);margin-left:6px}
  .grade{margin:22px 0 30px;animation:rise .6s both}
  .grade-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .grade-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
    background:var(--c);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);transform:rotate(-4deg)}
  .grade-icon svg{width:28px;height:28px}
  .grade-head h2{margin:0;font-size:26px}
  .grade-head .count{font-size:13px;color:var(--ink-soft);margin-left:2px}
  .grade-head .rule{flex:1;height:0;border-top:2px dashed var(--line);margin-left:6px}

  .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .grid>*{min-width:0}
  @media(min-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

  .card{position:relative;display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;
    background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px 14px 14px 14px;
    box-shadow:var(--shadow);transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, border-color .2s;
    animation:pop .5s both}
  a.card:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--c)}
  a.card:active{transform:translateY(1px) scale(.99)}
  .card .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
    background:var(--s);color:var(--c);transition:transform .3s}
  a.card:hover .ic{transform:rotate(-8deg) scale(1.06)}
  .card .ic svg{width:28px;height:28px}
  .card .body{min-width:0;flex:1}
  .card h3{margin:2px 0 4px;font-size:18px;line-height:1.3;text-wrap:balance}
  .card .unit{display:inline-block;margin:0 0 4px;font-family:"Jua";font-size:12px;color:var(--c);background:var(--s);border-radius:8px;padding:2px 8px}
  .card p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-soft);text-wrap:pretty}
  .card .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#B0927E}
  .card .meta span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .meta{flex-wrap:nowrap!important}
  .card .grade-tag{flex:none;font-family:"Jua";font-size:12.5px;line-height:1;color:#fff;background:var(--gc);border-radius:999px;padding:4px 9px 3px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .card .tag{background:var(--s);color:var(--c);border-radius:8px;padding:2px 8px;font-family:"Jua";font-size:12px}
  .card .go{flex:none;align-self:center;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--s);color:var(--c);transition:transform .2s}
  a.card:hover .go{transform:translateX(3px)}
  .card .go svg{width:16px;height:16px}
  .card.off{border-style:dashed;background:rgba(255,253,247,.6);box-shadow:none}
  .card.off .ic{filter:saturate(.6)}
  .note{font-size:12px;color:#B0927E}

  .empty{text-align:center;padding:36px 10px;color:var(--ink-soft)}
  .empty svg{width:64px;height:64px;color:#E6B98E;animation:bob 3s ease-in-out infinite}

  footer{text-align:center;color:#B0927E;font-size:13px;padding:10px 16px 40px}
  footer .pencil{display:inline-block;animation:bob 3s ease-in-out infinite}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

<header class="hero">

const $list = document.getElementById('list');
const $q = document.getElementById('q');

const ico = (id)=>`<svg viewBox="0 0 24 24"><use href="#i-${id}"/></svg>`;
const host = (u)=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
const esc = (s)=>s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));


function descHTML(d){
  let unit='', rest=d;
  const parts=d.split(' / ');
  if(parts.length>1){ unit=parts[0]; rest=parts.slice(1).join(' / '); }
  else { const m=d.match(/^(탐구단원\d)\s+(.*)$/); if(m){unit=m[1]; rest=m[2];} }
  return (unit?`<span class="unit">${esc(unit)}</span>`:'')+`<p>${esc(rest)}</p>`;
}
function card(t, gr, i){
  const style = `--c:${gr.c};--s:${gr.s};animation-delay:${Math.min(i*40,600)}ms`;
  if(!t.url){
    return `<div class="card off" style="${style}">
      <div class="ic">${ico(t.icon)}</div>
      <div class="body"><h3>${esc(t.name)}</h3>${descHTML(t.desc)}
      <div class="meta"><span class="note">🔗 링크 준비 중</span></div></div></div>`;
  }
  return `<a class="card" href="${t.url}" target="_blank" rel="noopener" style="${style}">
    <div class="ic">${ico(t.icon)}</div>
    <div class="body"><h3>${esc(t.name)}</h3>${descHTML(t.desc)}
      <div class="meta"><span class="grade-tag" style="--gc:var(--g${t.g});--gs:var(--g${t.g}s)">${t.g}학년</span><span>${host(t.url)}</span></div></div>
    <div class="go">${ico('arrow')}</div></a>`;
}

function render(){
  const q = $q.value.trim().toLowerCase();
  const items = TOOLS.filter(t=>!q || (t.name+' '+t.desc).toLowerCase().includes(q));
  if(!items.length){
    $list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24"><use href="#i-magnify"/></svg>
      <p class="jua" style="font-size:20px;margin:10px 0 4px">찾는 도구가 없어요</p><p>다른 낱말로 검색해 보세요.</p></div>`;
    return;
  }
  $list.innerHTML = `<div class="list-head"><span class="jua">전체 도구</span><span class="count">${items.length}개</span><span class="rule"></span></div>
    <div class="grid">${items.map((t,i)=>card(t, PALETTE[TOOLS.indexOf(t)%PALETTE.length], i)).join('')}</div>`;
}

$q.addEventListener('input', render);

render();
</script>
